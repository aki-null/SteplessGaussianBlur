<svg xmlns="http://www.w3.org/2000/svg" width="560" height="270" viewBox="0 0 560 270" role="img" aria-labelledby="title desc">
  <title id="title">Separable Gaussian</title>
  <desc id="desc">Gaussian X writes a full-resolution intermediate texture and Gaussian Y the result.</desc>
  <defs>
    <marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1e293b; font-size: 14px; }
    .box { stroke: #64748b; stroke-width: 1.5; }
    .heading { font-size: 15px; font-weight: 600; text-anchor: middle; fill: #334155; }
    .label { font-size: 15px; font-weight: 600; text-anchor: middle; }
    .sub { font-size: 12px; fill: #475569; }
    .arrow { fill: none; stroke: #475569; stroke-width: 1.6; marker-end: url(#head); }
  </style>
  <rect width="560" height="270" rx="8" fill="#ffffff"/>
  <text x="280" y="26" class="heading">Sigma 0.75–1.62</text>
  <rect class="box" x="33" y="44" width="144" height="81" rx="5" fill="#eff6ff"/>
  <text x="105" y="80.5" class="label">Source</text>
  <text x="105" y="101.5" class="sub" text-anchor="middle">Full res</text>
  <rect class="box" x="383" y="44" width="144" height="81" rx="5" fill="#eff6ff"/>
  <text x="455" y="80.5" class="label">Result</text>
  <text x="455" y="101.5" class="sub" text-anchor="middle">Full res</text>
  <rect class="box" x="208" y="169" width="144" height="81" rx="5" fill="#eff6ff"/>
  <text x="280" y="205.5" class="label">Intermediate</text>
  <text x="280" y="226.5" class="sub" text-anchor="middle">Full res</text>
  <path class="arrow" d="M105 125 V209.5 H202"/>
  <text x="156.5" y="230.5" text-anchor="middle">Gaussian X</text>
  <path class="arrow" d="M352 209.5 H455 V131"/>
  <text x="403.5" y="230.5" text-anchor="middle">Gaussian Y</text>
</svg>
