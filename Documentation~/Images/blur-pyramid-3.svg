<svg xmlns="http://www.w3.org/2000/svg" width="560" height="374" viewBox="0 0 560 374" role="img" aria-labelledby="title desc">
  <title id="title">Three-level blur pyramid</title>
  <desc id="desc">Binomial downsampling writes half, quarter and eighth resolution. A Gaussian in one or two passes filters the coarsest resolution. Cubic upsampling climbs back; the last upsample is bilinear.</desc>
  <defs>
    <marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1e293b; font-size: 14px; }
    .box { stroke: #64748b; stroke-width: 1.5; }
    .heading { font-size: 15px; font-weight: 600; text-anchor: middle; fill: #334155; }
    .label { font-size: 15px; font-weight: 600; text-anchor: middle; }
    .sub { font-size: 12px; fill: #475569; }
    .arrow { fill: none; stroke: #475569; stroke-width: 1.6; marker-end: url(#head); }
  </style>
  <rect width="560" height="374" rx="8" fill="#ffffff"/>
  <text x="280" y="26" class="heading">Sigma 8.55–16.1</text>
  <rect class="box" x="33" y="44" width="144" height="81" rx="5" fill="#eff6ff"/>
  <text x="105" y="80.5" class="label">Source</text>
  <text x="105" y="101.5" class="sub" text-anchor="middle">Full res</text>
  <rect class="box" x="383" y="44" width="144" height="81" rx="5" fill="#eff6ff"/>
  <text x="455" y="80.5" class="label">Result</text>
  <text x="455" y="101.5" class="sub" text-anchor="middle">Full res</text>
  <rect class="box" x="69" y="169" width="72" height="40.5" rx="2.8" fill="#dbeafe"/>
  <text x="59" y="193.25" class="sub" text-anchor="end">½ res</text>
  <rect class="box" x="419" y="169" width="72" height="40.5" rx="2.8" fill="#dbeafe"/>
  <text x="501" y="193.25" class="sub" text-anchor="start">½ res</text>
  <path class="arrow" d="M105 125 V163"/>
  <text x="122" y="149" text-anchor="start">2x down, 6 taps</text>
  <path class="arrow" d="M455 169 V131"/>
  <text x="438" y="155" text-anchor="end">Bilinear up</text>
  <rect class="box" x="87" y="253.5" width="36" height="20.25" rx="2" fill="#bfdbfe"/>
  <text x="77" y="267.625" class="sub" text-anchor="end">¼ res</text>
  <rect class="box" x="437" y="253.5" width="36" height="20.25" rx="2" fill="#bfdbfe"/>
  <text x="483" y="267.625" class="sub" text-anchor="start">¼ res</text>
  <path class="arrow" d="M105 209.5 V247.5"/>
  <text x="122" y="233.5" text-anchor="start">2x down, 6 taps</text>
  <path class="arrow" d="M455 253.5 V215.5"/>
  <text x="438" y="239.5" text-anchor="end">Cubic up</text>
  <rect class="box" x="96" y="317.75" width="18" height="10.125" rx="1.4" fill="#93c5fd"/>
  <text x="86" y="326.812" class="sub" text-anchor="end">⅛ res</text>
  <rect class="box" x="446" y="317.75" width="18" height="10.125" rx="1.4" fill="#93c5fd"/>
  <text x="474" y="326.812" class="sub" text-anchor="start">⅛ res</text>
  <path class="arrow" d="M105 273.75 V311.75"/>
  <text x="122" y="297.75" text-anchor="start">2x down, 6 taps</text>
  <path class="arrow" d="M455 317.75 V279.75"/>
  <text x="438" y="303.75" text-anchor="end">Cubic up</text>
  <path class="arrow" d="M114 322.812 H440"/>
  <text x="280" y="343.812" text-anchor="middle">Gaussian</text>
  <text x="280" y="360.812" class="sub" text-anchor="middle">1–2 passes</text>
</svg>
