<svg xmlns="http://www.w3.org/2000/svg" width="560" height="338" viewBox="0 0 560 338" role="img" aria-labelledby="title desc">
  <title id="title">Wide blur</title>
  <desc id="desc">4x downsampling writes quarter resolution and two 4-tap 2x downs reach sixteenth resolution. Gaussian X and Y filter there. Cubic upsampling writes quarter resolution and bilinear upsampling full resolution.</desc>
  <defs>
    <marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1e293b; font-size: 14px; }
    .box { stroke: #64748b; stroke-width: 1.5; }
    .heading { font-size: 15px; font-weight: 600; text-anchor: middle; fill: #334155; }
    .label { font-size: 15px; font-weight: 600; text-anchor: middle; }
    .sub { font-size: 12px; fill: #475569; }
    .arrow { fill: none; stroke: #475569; stroke-width: 1.6; marker-end: url(#head); }
  </style>
  <rect width="560" height="338" rx="8" fill="#ffffff"/>
  <text x="280" y="26" class="heading">Sigma 24–70</text>
  <rect class="box" x="33" y="44" width="144" height="81" rx="5" fill="#eff6ff"/>
  <text x="105" y="80.5" class="label">Source</text>
  <text x="105" y="101.5" class="sub" text-anchor="middle">Full res</text>
  <rect class="box" x="383" y="44" width="144" height="81" rx="5" fill="#eff6ff"/>
  <text x="455" y="80.5" class="label">Result</text>
  <text x="455" y="101.5" class="sub" text-anchor="middle">Full res</text>
  <rect class="box" x="87" y="169" width="36" height="20.25" rx="2" fill="#bfdbfe"/>
  <text x="77" y="183.125" class="sub" text-anchor="end">¼ res</text>
  <path class="arrow" d="M105 125 V163"/>
  <text x="122" y="149" text-anchor="start">4x down</text>
  <rect class="box" x="96" y="233.25" width="18" height="10.125" rx="1.4" fill="#93c5fd"/>
  <text x="86" y="242.312" class="sub" text-anchor="end">⅛ res</text>
  <path class="arrow" d="M105 189.25 V227.25"/>
  <text x="122" y="213.25" text-anchor="start">2x down, 4 taps</text>
  <rect class="box" x="100.5" y="287.375" width="9" height="5.0625" rx="1" fill="#60a5fa"/>
  <text x="105" y="308.438" class="sub" text-anchor="middle">1/16 res</text>
  <path class="arrow" d="M105 243.375 V281.375"/>
  <text x="122" y="267.375" text-anchor="start">2x down, 4 taps</text>
  <rect class="box" x="275.5" y="287.375" width="9" height="5.0625" rx="1" fill="#60a5fa"/>
  <text x="280" y="308.438" class="sub" text-anchor="middle">1/16 res</text>
  <rect class="box" x="450.5" y="287.375" width="9" height="5.0625" rx="1" fill="#60a5fa"/>
  <text x="455" y="308.438" class="sub" text-anchor="middle">1/16 res</text>
  <path class="arrow" d="M109.5 289.906 H269.5"/>
  <text x="192.5" y="310.906" text-anchor="middle">Gaussian X</text>
  <path class="arrow" d="M284.5 289.906 H444.5"/>
  <text x="367.5" y="310.906" text-anchor="middle">Gaussian Y</text>
  <rect class="box" x="437" y="169" width="36" height="20.25" rx="2" fill="#bfdbfe"/>
  <text x="483" y="183.125" class="sub" text-anchor="start">¼ res</text>
  <path class="arrow" d="M455 287.375 V195.25"/>
  <text x="438" y="246.312" text-anchor="end">Cubic up</text>
  <path class="arrow" d="M455 169 V131"/>
  <text x="438" y="155" text-anchor="end">Bilinear up</text>
</svg>
