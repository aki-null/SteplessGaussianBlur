<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" role="img" aria-labelledby="title desc">
  <title id="title">Switch at sigma 24</title>
  <desc id="desc">The transition downsamples to eighth resolution, runs its Gaussian there and upsamples. The wide layout downsamples once more, to sixteenth resolution, and runs its Gaussian there. The transition stands in for that extra level with a virtual level: down to sixteenth resolution, a Gaussian and up to eighth resolution, computed as one weight array mixed into its eighth-resolution Gaussian.</desc>
  <defs>
    <marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker>
    <marker id="headv" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#b45309"/></marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1e293b; font-size: 13px; }
    .box { stroke: #64748b; stroke-width: 1.5; }
    .heading { font-size: 15px; font-weight: 600; text-anchor: middle; fill: #334155; }
    .sub { font-size: 12px; fill: #475569; }
    .res { font-size: 12px; fill: #475569; text-anchor: end; }
    .arrow { fill: none; stroke: #475569; stroke-width: 1.6; marker-end: url(#head); }
    .varrow { fill: none; stroke: #b45309; stroke-width: 1.6; stroke-dasharray: 4 3; marker-end: url(#headv); }
    .vtext { fill: #b45309; font-size: 12px; }
    .extra { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.2; }
    .vbox { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.2; stroke-dasharray: 5 3; }
  </style>
  <rect width="640" height="350" rx="8" fill="#ffffff"/>
  <text x="145" y="30" class="heading">Transition, sigma 21–24</text>
  <rect class="vbox" x="112" y="210" width="86" height="82" rx="6"/>
  <rect class="box" x="45.0" y="57.0" width="40" height="26" rx="2" fill="#eff6ff"/>
  <text x="39.0" y="74" class="res">full</text>
  <rect class="box" x="81.0" y="123.0" width="28" height="18" rx="2" fill="#bfdbfe"/>
  <text x="75.0" y="136" class="res">¼</text>
  <rect class="box" x="115.0" y="187.5" width="20" height="13" rx="2" fill="#93c5fd"/>
  <text x="109.0" y="198" class="res">⅛</text>
  <rect class="box" x="175.0" y="187.5" width="20" height="13" rx="2" fill="#93c5fd"/>
  <rect class="box" x="201.0" y="123.0" width="28" height="18" rx="2" fill="#bfdbfe"/>
  <rect class="box" x="225.0" y="57.0" width="40" height="26" rx="2" fill="#eff6ff"/>
  <path class="arrow" d="M65 83.0 L95 119.0"/>
  <path class="arrow" d="M95 141.0 L125 183.5"/>
  <path class="arrow" d="M135.0 194 H171.0"/>
  <text x="155.0" y="182" class="sub" style="text-anchor:middle">Gaussian</text>
  <path class="arrow" d="M185 187.5 L215 145.0"/>
  <text x="210.0" y="167.0" class="sub" style="text-anchor:start">2x cubic</text>
  <path class="arrow" d="M215 123.0 L245 87.0"/>
  <text x="240.0" y="105.0" class="sub" style="text-anchor:start">4x bilinear</text>
  <rect class="box" x="131.0" y="263.5" width="14" height="9" rx="2" fill="#60a5fa"/>
  <text x="125.0" y="272" class="res">1/16</text>
  <rect class="box" x="165.0" y="263.5" width="14" height="9" rx="2" fill="#60a5fa"/>
  <path class="varrow" d="M125 200.5 L138 259.5"/>
  <path class="varrow" d="M145.0 268 H161.0"/>
  <path class="varrow" d="M172 263.5 L185 204.5"/>
  <text x="155" y="312" class="vtext" style="text-anchor:middle">virtual level: not drawn,</text>
  <text x="155" y="328" class="vtext" style="text-anchor:middle">blended into the ⅛ Gaussian</text>
  <text x="465" y="30" class="heading">Wide, sigma 24–70</text>
  <rect class="extra" x="432" y="210" width="86" height="82" rx="6"/>
  <rect class="box" x="365.0" y="57.0" width="40" height="26" rx="2" fill="#eff6ff"/>
  <text x="359.0" y="74" class="res">full</text>
  <rect class="box" x="401.0" y="123.0" width="28" height="18" rx="2" fill="#bfdbfe"/>
  <text x="395.0" y="136" class="res">¼</text>
  <rect class="box" x="435.0" y="187.5" width="20" height="13" rx="2" fill="#93c5fd"/>
  <text x="429.0" y="198" class="res">⅛</text>
  <rect class="box" x="458.0" y="263.5" width="14" height="9" rx="2" fill="#60a5fa"/>
  <text x="452.0" y="272" class="res">1/16</text>
  <rect class="box" x="493.0" y="263.5" width="14" height="9" rx="2" fill="#60a5fa"/>
  <rect class="box" x="526.0" y="123.0" width="28" height="18" rx="2" fill="#bfdbfe"/>
  <rect class="box" x="550.0" y="57.0" width="40" height="26" rx="2" fill="#eff6ff"/>
  <path class="arrow" d="M385 83.0 L415 119.0"/>
  <path class="arrow" d="M415 141.0 L445 183.5"/>
  <path class="arrow" d="M445 200.5 L465 259.5"/>
  <path class="arrow" d="M472.0 268 H489.0"/>
  <path class="arrow" d="M500 263.5 L540 145.0"/>
  <text x="532" y="204.0" class="sub" style="text-anchor:start">4x cubic</text>
  <path class="arrow" d="M540 123.0 L570 87.0"/>
  <text x="565.0" y="105.0" class="sub" style="text-anchor:start">4x bilinear</text>
  <text x="482" y="312" class="sub" style="text-anchor:middle">drawn for real: down to 1/16</text>
  <text x="482" y="328" class="sub" style="text-anchor:middle">and a Gaussian there</text>
</svg>
